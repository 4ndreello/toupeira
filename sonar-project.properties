sonar.javascript.lcov.reportPaths=coverage/lcov.info

# wait for the gate verdict and exit nonzero when it fails, so a pull request
# that drops below the bar cannot be merged green. costs about a minute of
# polling; without it the scanner uploads and exits 0 no matter the result
