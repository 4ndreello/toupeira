name: sonar

# unlike ci.yml this also runs on main, and the difference is load-bearing: the
# quality gate judges a pull request against the last analysis of its base
# branch, so main has to be analyzed or there is no baseline to judge against
on:
  pull_request:
  push:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sonar blames every line to date it; a shallow clone leaves it unable
          # to tell new code from old, which is the whole gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # one version on purpose: the matrix in ci.yml would upload the same
          # report three times
          node-version: 24
      # coverage comes from node's own test runner, so this stays dependency-free
      - run: npm run coverage
      # pinned to a commit, not a tag: a tag can be moved, and this one already
      # was — v5 kept working while it silently became a version with a known
      # vulnerability. sonar's own githubactions:S7637 fails the gate over it
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
