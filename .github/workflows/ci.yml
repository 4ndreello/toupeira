name: ci

# pull requests only: main is only ever reached through a merged PR, so running
# the same commit again after the merge tests nothing new
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # dev-only dependencies (typescript for the build) install from the committed
      # lockfile. scripts stay off: nothing here needs lifecycle hooks, and running
      # them would execute whatever a compromised dependency ships on install
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test

  coverage:
    # a ratchet, not a target: this number goes up over time and never down, so a
    # pull request that adds code without tests drops the average and fails here.
    # its own job because --test-coverage-lines does not exist on node 20, which
    # the matrix above still has to cover. the gate measures dist, so the build
    # runs first through npm run coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run coverage

  package:
    # the published tarball is its own failure mode: dist/ is built by prepack and
    # must be listed in "files", or the install below gets a package that cannot start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm pack
      - name: install the tarball and run the bin
        run: |
          mkdir -p /tmp/packtest && cd /tmp/packtest
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/toupeira-*.tgz
          ./node_modules/.bin/toupeira --help | grep -q 'clean up what coding agents leave behind'

  version:
    # a merged PR that forgot the bump means the release never happens, and it is
    # only noticed after the merge, when fixing it costs a second PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - name: the version must move whenever shipped code does
        run: |
          # docs and ci config ship nothing — "files" in package.json never lists
          # them — so a pull request touching only these needs no version
          git diff --name-only FETCH_HEAD HEAD \
            | grep -qvE '(\.md$|^\.github/|^\.gitignore$)' || exit 0
          old=$(git show FETCH_HEAD:package.json | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          new=$(node -p "require('./package.json').version")
          test "$old" != "$new" || {
            echo "package.json is still $old — bump it, or the release never happens"
            exit 1
          }
