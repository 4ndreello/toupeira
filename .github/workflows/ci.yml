name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # no dependencies, so there is nothing to install and no lockfile to ci from
      - run: npm test

  package:
    # the published tarball is its own failure mode: index.js imports lib/, and a
    # "files" field that forgets it installs a package that cannot start.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack
      - name: install the tarball and run the bin
        run: |
          mkdir -p /tmp/packtest && cd /tmp/packtest
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/toupeira-*.tgz
          ./node_modules/.bin/toupeira --help | grep -q 'clean up what coding agents leave behind'
